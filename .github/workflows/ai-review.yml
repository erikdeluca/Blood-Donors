name: AI Code Review

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run AI Reviewer on changed files
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin "${{ github.base_ref }}"
          mapfile -t FILES < <(
            git -c core.quotepath=false diff --name-only --diff-filter=ACMR \
              "origin/${{ github.base_ref }}...HEAD" -- \
              '*.py' '*.R' '*.ipynb' 'app/**' 'python/**' 'R/**'
          )

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "# Code Review Report"
            echo "Analysis generated automatically by AI"
            echo "---"
          } > report.md

          for file in "${FILES[@]}"; do
            if [[ -f "$file" ]]; then
              echo "🔍 Analyzing: $file ..."
              echo "## 📄 File: \`$file\`" >> report.md
              uv run --no-project \
                --with google-genai \
                --with python-dotenv \
                python ai_agents.py reviewer "$file" >> report.md
              echo -e "\n\n---\n" >> report.md
              sleep 2
            fi
          done

          echo "has_report=true" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.review.outputs.has_report == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -F report.md
