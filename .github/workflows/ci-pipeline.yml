name: CI

on:
  push:
    branches: [master, fix-GA-CI]
    paths:
      - 'app/**'
      - 'python/**'
      - 'main.py'
      - 'environment.yml'
      - 'thesis/**'
      - notebooks/**
      - slides/**

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    # disable R profile to avoid conflicts
    env:
      R_PROFILE_USER: "/dev/null"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          activate-environment: blood-donors
          environment-file: environment.yml
          auto-activate-base: false
          use-mamba: true

      - name: Install missing R packages from CRAN
        run: |
          Rscript -e "install.packages('lifecontingencies', repos='https://cloud.r-project.org')"

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check .

      # for streamlit app testing
      - name: Smoke Test Python App
        run: |
          python -c "import app.config; import app.logic; print('App Python OK')"

      - name: Render Quarto Thesis (Smoke Test)
        run: |
          quarto render thesis/index.qmd --to html
          quarto --version
