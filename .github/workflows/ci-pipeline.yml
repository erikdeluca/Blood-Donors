name: Project CI (Python + R + Quarto)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'python/**'
      - 'main.py'
      - 'environment.yml'
      - 'thesis/**'
      - notebooks/**
      - slides/**

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        activate-environment: blood-donors
        environment-file: environment.yml
        auto-activate-base: false
        use-mamba: true

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # for streamlit app testing
    - name: Smoke Test Python App
      run: |
        python -c "import app.config; import app.logic; print('App Python OK')"

    - name: Render Quarto Thesis (Smoke Test)
      run: |
        quarto render thesis/index.qmd --to html
        quarto --version
