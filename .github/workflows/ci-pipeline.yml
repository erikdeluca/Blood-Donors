name: CI

on:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'python/**'
      - 'main.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'thesis/**'
      - 'notebooks/**'
      - 'slides/**'
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uvx ruff check .

      - name: Smoke Test Python App
        run: uv run python -c "import app.config; import app.logic; print('App Python OK')"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Thesis (Smoke Test)
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          quarto --version
          quarto render thesis/index.qmd --to html
