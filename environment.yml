name: blood-donors
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # --- CORE PYTHON ---
  - python=3.11
  - pip

  # --- APP & DASHBOARD ---
  - streamlit
  - plotly
  - tabulate

  # --- DATA SCIENCE & MATH ---
  - pandas
  - numpy
  - scipy
  - statsmodels
  - matplotlib
  - seaborn

  # --- MACHINE LEARNING & MODEL ---
  - pytorch
  - pyro-ppl
  - torchvision

  # --- NOTEBOOKS & TOOLS ---
  - jupyterlab
  - ipykernel
  - flake8
  - pytest
  - pre-commit

  # --- R ENVIRONMENT ---
  - r-base
  - r-tidyverse
  - r-reticulate
  - r-rmarkdown
  - r-knitr

  # --- QUARTO ---
  - quarto

# --- R EXTRA (Dal tuo renv.lock) ---
  - r-janitor
  - r-here
  - r-gtsummary
  - r-gt
  - r-patchwork
  - r-survival

  # -- Mixed models & advanced stats --
  - r-lme4
  - r-glmmtmb
  - r-marginaleffects
  - r-markovchain
  - r-diagram
  - r-mgcv

  # -- Bayesian packages --
  - r-bayestestr
  - r-parameters
  - r-performance
  - r-insight
  - r-see
  - r-effectsize
