[project]
name = "blood-donors"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cycler>=0.12.1",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyprojroot>=0.3.0",
    "pyro-ppl>=1.9.2",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
]

[dependency-groups]
notebooks = [
    "hmmlearn>=0.3.3",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "networkx>=3.6.1",
    "plotnine>=0.15.9",
    "polars>=2.1.0",
    "scikit-learn>=1.9.1",
]
quarto = [
    "shiny>=1.9.0",
]
dev = [
    { include-group = "notebooks" },
    "python-dotenv>=1.2.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
